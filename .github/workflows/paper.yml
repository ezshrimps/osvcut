name: paper
on:
  push:
    paths: ["paper/**", ".github/workflows/paper.yml"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Static checks
        run: cd paper && python3 check_tex.py main.tex
      - name: Compile (latexmk)
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: paper
          latexmk_use_lualatex: false
      - uses: actions/upload-artifact@v4
        with:
          name: osvcut-paper
          path: paper/main.pdf
